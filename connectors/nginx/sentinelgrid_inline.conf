# =============================================================================
# SentinelGrid Nginx In-Line WAAP Gateway Configuration (auth_request module)
# Intercepts all incoming HTTP traffic, queries SentinelGrid Control Plane (/v1/inspect),
# and either proxies legitimate traffic to origin or immediately returns HTTP 403.
# Author: SentinelGrid Architecture Core Team
# =============================================================================

upstream origin_application {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream sentinelgrid_engine {
    server 127.0.0.1:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    # Global proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. Protected Ingress Route
    location / {
        # Sub-request authorization to SentinelGrid
        auth_request /_sentinelgrid_verify;

        # Capture response headers from SentinelGrid inspection
        auth_request_set $sg_action $upstream_http_x_sentinelgrid_action;
        auth_request_set $sg_event  $upstream_http_x_sentinelgrid_event_id;
        auth_request_set $sg_rule   $upstream_http_x_sentinelgrid_rule;

        # Forward headers downstream to client
        add_header X-SentinelGrid-Action $sg_action always;
        add_header X-SentinelGrid-Event-ID $sg_event always;

        # Proxy legitimate traffic to protected origin
        proxy_pass http://origin_application;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 2. Internal Sub-Request for In-Line Threat Inspection
    location = /_sentinelgrid_verify {
        internal;
        proxy_pass http://sentinelgrid_engine/v1/inspect;
        proxy_pass_request_body on;
        
        # Sub-request timeout tuning (50ms budget)
        proxy_connect_timeout 30ms;
        proxy_read_timeout 50ms;
        proxy_send_timeout 50ms;

        proxy_set_header Content-Type "application/json";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Custom 403 Forbidden Error Page
    error_page 403 /_sentinelgrid_blocked.html;
    location = /_sentinelgrid_blocked.html {
        internal;
        default_type text/html;
        return 403 '<!DOCTYPE html><html><body style="font-family:sans-serif;padding:40px;text-align:center;"><h2>403 Forbidden: Blocked by SentinelGrid WAAP</h2><p>Malicious request or unauthorized traffic intercepted.</p></body></html>';
    }
}
