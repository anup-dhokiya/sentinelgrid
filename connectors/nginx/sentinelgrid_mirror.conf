# =============================================================================
# SentinelGrid Nginx Passive Mirroring Configuration (mirror module)
# Zero-latency shadow observation: Duplicates request streams to SentinelGrid
# without impacting client round-trip latency. Discovers shadow APIs and logs SIEM telemetry.
# Author: Anup Dhokiya (@anup-dhokiya) - Lead Architect
# =============================================================================

upstream origin_application {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream sentinelgrid_shadow_collector {
    server 127.0.0.1:8000;
    keepalive 64;
}

server {
    listen 80;
    server_name _;

    location / {
        # Asynchronously duplicate request traffic to internal mirror
        mirror /_sentinelgrid_mirror;
        mirror_request_body on;

        # Direct primary traffic to origin with zero added latency
        proxy_pass http://origin_application;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }

    # Internal shadow mirror handler
    location = /_sentinelgrid_mirror {
        internal;
        proxy_pass http://sentinelgrid_shadow_collector/v1/inspect;
        proxy_pass_request_body on;
        proxy_ignore_client_abort on;

        # Aggressive timeouts to prevent mirror backpressure
        proxy_connect_timeout 20ms;
        proxy_read_timeout 30ms;
        proxy_send_timeout 30ms;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-SentinelGrid-Mode "shadow-mirror";
    }
}
