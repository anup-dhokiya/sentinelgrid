services:
  - type: web
    name: sentinelgrid-waap
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATA_DIR
        value: /var/data
    disk:
      name: sentinelgrid-data
      mountPath: /var/data
      sizeGB: 1
