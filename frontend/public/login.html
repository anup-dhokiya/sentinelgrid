<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SentinelGrid // Security Operations Authentication</title>
  <style>
    :root {
      --bg-void: #07090E;
      --bg-surface: #0C101A;
      --bg-card: #111726;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-active: rgba(56, 189, 248, 0.4);
      --accent-cyan: #38BDF8;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'Space Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg-void);
      color: var(--text-primary);
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Ambient Cyber Background Grid */
    .bg-grid {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-size: 36px 36px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      z-index: 1;
    }

    /* Animated Sweeping Radar Beam */
    .radar-sweep-beam {
      position: absolute;
      width: 100vw;
      height: 2px;
      background: linear-gradient(90deg, transparent, #38BDF8, transparent);
      opacity: 0.18;
      animation: sweepDown 8s linear infinite;
      z-index: 2;
    }

    @keyframes sweepDown {
      0% { top: -10px; }
      100% { top: 100vh; }
    }

    /* 3D Glassmorphic Login Container */
    .login-3d-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 38px 36px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      transform-style: preserve-3d;
      transition: transform 0.15s ease;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-family: monospace;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }

    .form-input-cyber {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text-primary);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-input-cyber:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .btn-cyber-primary {
      width: 100%;
      background: #0284C7;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-cyber-primary:hover {
      background: #0369A1;
    }
    .btn-cyber-primary:active {
      transform: scale(0.98);
    }

    /* Biometric Scanning Beam Overlay on Submit */
    .scanning-line {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: #38BDF8;
      box-shadow: 0 0 10px #38BDF8;
      display: none;
      animation: scanCard 1.2s ease-in-out infinite alternate;
      border-radius: 16px 16px 0 0;
    }

    @keyframes scanCard {
      from { top: 0%; }
      to { top: 100%; }
    }

    .radar-outer-ring {
      animation: radarRotate 12s linear infinite;
      transform-origin: 50px 50px;
    }
    .shield-crystal-core {
      animation: crystalPulse 2.4s ease-in-out infinite;
      transform-origin: 50px 50px;
    }
    @keyframes radarRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes crystalPulse {
      0%, 100% { opacity: 0.8; transform: scale(0.96); }
      50% { opacity: 1; transform: scale(1.06); filter: drop-shadow(0 0 6px #38BDF8); }
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="radar-sweep-beam"></div>

  <div class="login-3d-card" id="loginCard">
    <div class="scanning-line" id="scanLine"></div>

    <div style="text-align: center; margin-bottom: 28px;">
      <div style="margin: 0 auto 12px; width: 48px;">
        <svg width="48" height="48" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" stroke-dasharray="6,4" class="radar-outer-ring"/>
          <polygon points="50,10 88,32 88,68 50,90 12,68 12,32" fill="#21262D" stroke="#38BDF8" stroke-width="2"/>
          <polygon points="50,10 88,32 50,50 12,32" fill="rgba(56, 189, 248, 0.12)"/>
          <polygon points="88,32 88,68 50,50" fill="rgba(0, 0, 0, 0.4)"/>
          <polygon points="12,32 50,50 12,68" fill="rgba(255, 255, 255, 0.05)"/>
          <polygon points="50,34 64,50 50,66 36,50" fill="#38BDF8" class="shield-crystal-core"/>
          <circle cx="50" cy="50" r="4" fill="#F0F6FC"/>
        </svg>
      </div>
      <h1 style="font-size: 18px; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.2px;">SentinelGrid Console</h1>
      <p style="font-size: 11px; color: var(--text-secondary); margin: 0; font-family: monospace;">Zero-Trust L7 Threat Operations Plane</p>
    </div>

    <form onsubmit="handleCyberLogin(event)">
      <div class="form-group">
        <label class="form-label">Operator Email / Identity</label>
        <input type="email" id="login-email" class="form-input-cyber" value="anupdhokiya0@gmail.com" required autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label">Passphrase / Master Key</label>
        <input type="password" id="login-password" class="form-input-cyber" value="admin123" required autocomplete="current-password">
      </div>

      <button type="submit" id="login-btn" class="btn-cyber-primary" style="margin-top: 10px;">
        <span>🔒 Authenticate Session</span>
      </button>
    </form>

    <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-between; font-size: 11px; font-family: monospace; color: var(--text-secondary);">
      <span>SYSTEM: SECURE</span>
      <span>RFC 8032 Ed25519</span>
    </div>
  </div>

  <script>
    const card = document.getElementById("loginCard");
    document.addEventListener("mousemove", (e) => {
      const rect = card.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      card.style.transform = `perspective(1000px) rotateY(${x * 6}deg) rotateX(${-y * 6}deg)`;
    });

    async function handleCyberLogin(e) {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const scanLine = document.getElementById("scanLine");
      const btn = document.getElementById("login-btn");

      scanLine.style.display = "block";
      btn.innerHTML = "<span>⚡ Cryptographic Handshake...</span>";
      btn.style.opacity = "0.7";

      try {
        const res = await fetch("/v1/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem("sg_auth_token", data.token);
          localStorage.setItem("sg_auth_user", JSON.stringify(data.user));
          btn.innerHTML = "<span>✅ Identity Verified. Entering SOC...</span>";
          btn.style.background = "#10B981";
          setTimeout(() => {
            window.location.href = "/#dashboard";
          }, 500);
        } else {
          alert("Authentication Failed: " + (data.detail || "Invalid credentials"));
          scanLine.style.display = "none";
          btn.innerHTML = "<span>🔒 Authenticate Session</span>";
          btn.style.opacity = "1";
        }
      } catch (err) {
        alert("Server Unreachable: " + err);
        scanLine.style.display = "none";
        btn.innerHTML = "<span>🔒 Authenticate Session</span>";
        btn.style.opacity = "1";
      }
    }
  </script>
</body>
</html>
